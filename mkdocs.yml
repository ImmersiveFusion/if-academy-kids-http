# Conforms to SP-071 shared baseline (.context/current/work/spikes/SP-071-diataxis-docs-restructure/00-shared-baseline.md)
# Same plugin set, same theme features, same conventions as if-apm-documentation-http and the Knowledge Nexus.

# Project information
# site_name is the SHORT display label used in the sidebar nav and meta
# tags. The formal property name ("Immersive Fusion Academy (Kids)" per
# SP-065 lock) is preserved in copyright, license, and business artifacts;
# it does not need to be the visible nav label on every page.
site_name: IF Kids Academy
site_url: https://kids.immersivefusion.academy
site_description: A small publication about AI, written for kids, by an observability company.
site_author: Immersive Fusion LLC

# Local dev server address (overridable with `mkdocs serve -a HOST:PORT`)
dev_addr: '127.0.0.1:8010'

# Repository
repo_name: if-academy-kids-http
repo_url: https://github.com/ImmersiveFusion/if-academy-kids-http
edit_uri: edit/main/docs

# Copyright / byline. Rendered by Material's partials/copyright.html
# inside the footer-meta block. HTML is permitted here. The byline,
# license link, and about link all live here; Material appends its own
# "Made with Material for MkDocs" attribution line below this. The
# "Source on GitHub" link belongs in that lower line (see the
# overrides/partials/footer.html pager-only override), not here in
# the byline pill.
copyright: '<em>by Immersive Fusion.</em> Published under <a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license noopener">Creative Commons BY-NC 4.0</a> <span class="md-copyright__sep" aria-hidden="true">&middot;</span> <a href="/about/">About</a> <span class="md-copyright__sep" aria-hidden="true">&middot;</span> <a href="/how-this-is-made/">How this is made</a><br><span class="kids-sister-link">For grown-up readers: <a href="https://immersivefusion.academy">immersivefusion.academy</a></span><br><span class="kids-trademark-notice">Mosey and Wobble are trademarks of Immersive Fusion LLC.</span>'

watch:
  - docs
  - overrides

# Configuration
theme:
  name: material
  custom_dir: overrides
  # Browser-tab favicon and header logo. The full icon family
  # (apple-touch-icon, web-app-manifest, theme-color meta) is wired via
  # the {% block extrahead %} in overrides/main.html.
  #
  # favicon.svg is NOT used here — the SVG export is a base64-wrapped
  # raster, not true vector, so the PNG variants are smaller at the
  # sizes they actually render at.
  favicon: favicon.ico
  logo: favicon-96x96.png
  features:
    # SP-071 shared core, minus navigation.tabs (a two-page kids
    # publication does not need tabs; the storefront-feeling chrome
    # is suppressed per SP-069 ADR §Visual identity — "different room").
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer    # next/prev arrows under each booklet page
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Two schemes: warm-white "day" (warm white page, mint hill) and
    # indigo "night" (deep blue sky, darker forest hill, warm dark cards).
    # Same illustration carries across; speech bubbles stay light so they
    # glow against the night sky like lit windows. Toggle lives in the
    # header.
    - scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to night
    - scheme: kids-night
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to day
  # Font is set by docs/stylesheets/kids.css (Quicksand body,
  # Fredoka display). Disabled here so Material does not
  # also load Roboto from Google.
  font: false

extra_css:
  - stylesheets/kids.css

# Plugins: SP-071 shared baseline, identical set, identical order.
plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - awesome-pages
  - section-index
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  # SP-071 baseline deviation: git-revision-date-localized is omitted.
  # The shared baseline includes it for docs-site stale-content signals;
  # a kids' picture book doesn't have that problem (Frog and Toad
  # doesn't have a "last updated" stamp on each page either). Plugin
  # not loaded so build is faster and no per-page DOM bloat. Re-add if
  # we ever publish reference content that needs the freshness signal.
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        # Boop -> Mosey booklet rename (2026-06-03). Keeps the career-day
        # pamphlet / QR-code URL alive after the directory slug changed.
        booklets/boop-and-wobble-meet/index.md: booklets/mosey-and-wobble-meet/index.md
        booklets/boop-and-wobble-meet/01-why-we-wrote-this-down.md: booklets/mosey-and-wobble-meet/01-why-we-wrote-this-down.md
        booklets/boop-and-wobble-meet/02-the-beginning.md: booklets/mosey-and-wobble-meet/02-the-beginning.md
        booklets/boop-and-wobble-meet/03-meet-wobble.md: booklets/mosey-and-wobble-meet/03-meet-wobble.md
        booklets/boop-and-wobble-meet/04-plan-1-mix-everyone-up.md: booklets/mosey-and-wobble-meet/04-plan-1-mix-everyone-up.md
        booklets/boop-and-wobble-meet/05-plan-2-make-it-useless.md: booklets/mosey-and-wobble-meet/05-plan-2-make-it-useless.md
        booklets/boop-and-wobble-meet/06-plan-3-stump-it-with-hard-questions.md: booklets/mosey-and-wobble-meet/06-plan-3-stump-it-with-hard-questions.md
        booklets/boop-and-wobble-meet/07-plan-4-teach-it-to-lie.md: booklets/mosey-and-wobble-meet/07-plan-4-teach-it-to-lie.md
        booklets/boop-and-wobble-meet/08-plan-5-trick-the-robot.md: booklets/mosey-and-wobble-meet/08-plan-5-trick-the-robot.md
        booklets/boop-and-wobble-meet/09-plan-6-make-it-run-forever.md: booklets/mosey-and-wobble-meet/09-plan-6-make-it-run-forever.md
        booklets/boop-and-wobble-meet/10-plan-7-peek-at-its-memory.md: booklets/mosey-and-wobble-meet/10-plan-7-peek-at-its-memory.md
        booklets/boop-and-wobble-meet/11-plan-8-confuse-him.md: booklets/mosey-and-wobble-meet/11-plan-8-confuse-him.md
        booklets/boop-and-wobble-meet/12-plan-9-make-him-wobbly.md: booklets/mosey-and-wobble-meet/12-plan-9-make-him-wobbly.md
        booklets/boop-and-wobble-meet/13-plan-10-slip-through-the-rules.md: booklets/mosey-and-wobble-meet/13-plan-10-slip-through-the-rules.md
        booklets/boop-and-wobble-meet/14-the-end.md: booklets/mosey-and-wobble-meet/14-the-end.md
        booklets/boop-and-wobble-meet/15-what-this-story-is-really-about.md: booklets/mosey-and-wobble-meet/15-what-this-story-is-really-about.md
        booklets/boop-and-wobble-meet/traffic-light-scene.md: booklets/mosey-and-wobble-meet/traffic-light-scene.md
        booklets/boop-and-wobble-meet/credits.md: booklets/mosey-and-wobble-meet/credits.md

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true