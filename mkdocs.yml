# Conforms to SP-071 shared baseline (.context/current/work/spikes/SP-071-diataxis-docs-restructure/00-shared-baseline.md)
# Same plugin set, same theme features, same conventions as if-apm-documentation-http and the Knowledge Nexus.

# Project information
site_name: Immersive Fusion Academy (Kids)
site_url: https://kids.immersivefusion.academy
site_description: A small publication about AI, written for kids, by an observability company.
site_author: Immersive Fusion LLC

# Repository
repo_name: if-academy-kids-http
repo_url: https://github.com/ImmersiveFusion/if-academy-kids-http
edit_uri: edit/main/docs

# Copyright
copyright: 'Copyright &copy; 2026 <a href="https://www.immersivefusion.com">Immersive Fusion LLC</a>. Published under <a href="https://creativecommons.org/licenses/by-nc/4.0/">Creative Commons Attribution-NonCommercial 4.0 International</a>.'

watch:
  - docs
  - overrides

# Configuration
theme:
  name: material
  custom_dir: overrides
  features:
    # SP-071 shared core, minus navigation.tabs (a two-page kids
    # publication does not need tabs; the storefront-feeling chrome
    # is suppressed per SP-069 ADR §Visual identity — "different room").
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Light scheme: warm cream tint (not pure white). Companion dark
    # scheme uses a warm dark page, not slate-black, so the booklet voice
    # carries into low-light reading. Both schemes share the teal accent
    # and the Patrick Hand display font; the publication keeps its color
    # identity across modes.
    - scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: kids-dark
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Font is set by docs/stylesheets/kids.css (Quicksand body,
  # Patrick Hand display). Disabled here so Material does not
  # also load Roboto from Google.
  font: false

extra_css:
  - stylesheets/kids.css

# Plugins: SP-071 shared baseline, identical set, identical order.
plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - awesome-pages
  - section-index
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        # site-specific entries; starts empty, grows as content moves happen

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true